<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panthers Practice Planner</title>
<style>
  :root{
    --purple-900:#2e1a47;
    --purple-800:#3d2264;
    --purple-700:#4b2a80;
    --purple-600:#5c3399;
    --purple-500:#6f3fb6;
    --gold-500:#d9a441;
    --gold-400:#e6b85c;
    --gold-100:#faf1dd;
    --ink:#221733;
    --ink-soft:#5a5069;
    --paper:#ffffff;
    --bg:#f6f3fb;
    --line:#e3daf0;
    --card:#ffffff;
    --radius:14px;
    --shadow:0 2px 10px rgba(46,26,71,0.08);
    --shadow-lg:0 12px 30px rgba(46,26,71,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  ::selection{background:var(--gold-400);color:var(--purple-900);}

  /* ===== Top bar ===== */
  .topbar{
    background:linear-gradient(120deg,var(--purple-900),var(--purple-700) 60%,var(--purple-600));
    color:#fff;
    padding:18px 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    box-shadow:var(--shadow-lg);
    position:sticky;
    top:0;
    z-index:50;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .crest{
    width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--gold-400), var(--gold-500) 70%);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--purple-900);font-size:18px;
    border:2px solid rgba(255,255,255,0.6);
    flex:none;
  }
  .brand h1{font-size:19px;margin:0;letter-spacing:.3px;font-weight:800;}
  .brand p{margin:0;font-size:12px;color:var(--gold-100);opacity:.85;letter-spacing:.4px;text-transform:uppercase;}
  .topnav{display:flex;gap:8px;flex-wrap:wrap;}
  .topnav button{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    padding:9px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .topnav button:hover{background:rgba(255,255,255,0.18);}
  .topnav button.active{
    background:var(--gold-500);
    color:var(--purple-900);
    border-color:var(--gold-500);
  }

  .app{max-width:1400px;margin:0 auto;padding:22px 22px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ===== Builder layout ===== */
  .builder-grid{
    display:grid;
    grid-template-columns:280px 1fr 340px;
    gap:20px;
    align-items:start;
  }
  @media (max-width:1100px){
    .builder-grid{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    border:1px solid var(--line);
  }
  .panel h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--purple-700);
    margin:0 0 12px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--gold-500);}

  /* filter panel */
  .filter-group{margin-bottom:16px;}
  .filter-group .fg-title{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .cat-chip{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    border-radius:9px;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:4px;
    transition:background .12s;
  }
  .cat-chip:hover{background:var(--gold-100);}
  .cat-chip input{accent-color:var(--purple-600);width:15px;height:15px;cursor:pointer;}
  .cat-chip .swatch{width:10px;height:10px;border-radius:3px;flex:none;}
  .cat-count{margin-left:auto;font-size:11px;color:var(--ink-soft);background:var(--bg);border-radius:20px;padding:1px 7px;}

  .search-box{
    width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);
    font-size:13.5px;margin-bottom:14px;background:var(--bg);color:var(--ink);
  }
  .search-box:focus{outline:2px solid var(--purple-500);outline-offset:1px;}

  .filter-actions{display:flex;gap:8px;margin-top:10px;}
  .btn-mini{
    flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:7px 8px;font-size:11.5px;font-weight:700;color:var(--purple-700);cursor:pointer;
  }
  .btn-mini:hover{background:var(--gold-100);}

  /* drill library */
  .library-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .library-header h2{margin:0;font-size:20px;font-weight:800;color:var(--purple-900);}
  .result-count{font-size:12.5px;color:var(--ink-soft);}

  .drill-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:14px;
  }
  .drill-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:var(--shadow);
    transition:transform .12s, box-shadow .12s;
  }
  .drill-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .drill-card .thumb{
    width:100%;aspect-ratio:16/10;background:var(--gold-100);
    display:flex;align-items:center;justify-content:center;
    border-bottom:1px solid var(--line);overflow:hidden;
    cursor:zoom-in;
  }
  .drill-card .thumb img{width:100%;height:100%;object-fit:contain;padding:4px;}
  .drill-card .thumb.noimg{color:var(--purple-400);font-size:12px;color:var(--ink-soft);font-weight:600;}
  .drill-card .body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .cat-tag{
    align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 8px;border-radius:20px;color:#fff;
  }
  .drill-card h3{font-size:14px;margin:2px 0 0;color:var(--ink);font-weight:700;line-height:1.3;}
  .drill-card p{font-size:12px;color:var(--ink-soft);line-height:1.45;margin:0;flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .add-btn{
    margin-top:6px;width:100%;padding:8px;border-radius:8px;border:none;
    background:var(--purple-700);color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;
    transition:background .12s;
  }
  .add-btn:hover{background:var(--purple-600);}
  .add-btn.added{background:var(--gold-500);color:var(--purple-900);}
  .add-btn:disabled{opacity:.6;cursor:default;}

  /* category colors */
  .tag-lowblock{background:#3d2264;}
  .tag-attack{background:#b3391f;}
  .tag-transition{background:#1f7a5c;}
  .tag-skills{background:#c07d1a;}
  .tag-warmup{background:#5a5069;}

  /* ===== Practice tray (right panel) ===== */
  .tray-head input{
    width:100%;font-size:15px;font-weight:800;color:var(--purple-900);
    border:none;border-bottom:2px solid var(--line);padding:6px 2px 8px;margin-bottom:4px;background:transparent;
  }
  .tray-head input:focus{outline:none;border-color:var(--purple-500);}
  .tray-meta{display:flex;gap:8px;margin-bottom:14px;}
  .tray-meta input{
    flex:1;font-size:12px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);
  }
  .tray-list{display:flex;flex-direction:column;gap:8px;min-height:60px;margin-bottom:14px;}
  .tray-empty{
    text-align:center;color:var(--ink-soft);font-size:12.5px;padding:26px 10px;
    border:1.5px dashed var(--line);border-radius:10px;
  }
  .tray-item{
    display:flex;align-items:center;gap:8px;
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 9px;
  }
  .tray-item .ti-thumb{width:38px;height:30px;border-radius:5px;overflow:hidden;flex:none;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .tray-item .ti-thumb img{width:100%;height:100%;object-fit:contain;}
  .tray-item .ti-info{flex:1;min-width:0;}
  .tray-item .ti-info .ti-name{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tray-item .ti-info .ti-cat{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .ti-mins{
    width:44px;font-size:11.5px;text-align:center;padding:5px 3px;border:1px solid var(--line);border-radius:6px;background:#fff;
  }
  .ti-remove{
    background:none;border:none;color:#a63b3b;cursor:pointer;font-size:15px;font-weight:800;padding:2px 5px;line-height:1;
  }
  .ti-remove:hover{color:#7a2626;}
  .ti-order{display:flex;flex-direction:column;gap:2px;}
  .ti-order button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:11px;padding:0 3px;line-height:1;}
  .ti-order button:hover{color:var(--purple-700);}

  .tray-summary{
    display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);
    border-top:1px solid var(--line);padding-top:10px;margin-bottom:12px;
  }
  .tray-summary strong{color:var(--purple-800);}

  .btn-primary{
    width:100%;padding:11px;border:none;border-radius:9px;background:var(--gold-500);
    color:var(--purple-900);font-weight:800;font-size:14px;cursor:pointer;margin-bottom:8px;
    box-shadow:0 3px 10px rgba(217,164,65,.35);
  }
  .btn-primary:hover{background:var(--gold-400);}
  .btn-secondary{
    width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;
    color:var(--purple-700);font-weight:700;font-size:13px;cursor:pointer;
  }
  .btn-secondary:hover{background:var(--gold-100);}

  /* ===== Saved practices view ===== */
  .saved-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;
  }
  .saved-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;
  }
  .saved-card h3{margin:0;font-size:16px;color:var(--purple-900);font-weight:800;}
  .saved-card .sc-meta{font-size:12px;color:var(--ink-soft);}
  .saved-card .sc-drills{font-size:12.5px;color:var(--ink);line-height:1.5;max-height:90px;overflow:hidden;}
  .sc-actions{display:flex;gap:8px;margin-top:6px;}
  .sc-actions button{
    flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--line);
  }
  .sc-load{background:var(--purple-700);color:#fff;border-color:var(--purple-700);}
  .sc-load:hover{background:var(--purple-600);}
  .sc-print{background:#fff;color:var(--purple-700);}
  .sc-print:hover{background:var(--gold-100);}
  .sc-del{background:#fff;color:#a63b3b;}
  .sc-del:hover{background:#fbe9e9;}
  .empty-state{
    text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;
  }
  .empty-state .es-icon{font-size:38px;margin-bottom:10px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--purple-900);color:#fff;padding:11px 20px;border-radius:999px;
    font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  /* modal (image zoom) */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(34,23,51,.75);display:none;
    align-items:center;justify-content:center;z-index:300;padding:30px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px;position:relative;}
  .modal-box img{width:100%;border-radius:8px;}
  .modal-close{position:absolute;top:10px;right:12px;background:var(--purple-900);color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;}

  /* ===== Print view ===== */
  .print-sheet{display:none;}

  @media print{
    body *{visibility:hidden;}
    .topbar, .toast, .modal-overlay{display:none !important;}
    .print-sheet, .print-sheet *{visibility:visible;}
    .print-sheet{
      display:block !important;
      position:absolute;top:0;left:0;width:100%;
      background:#fff !important;
    }
    .app{padding:0;margin:0;max-width:none;}
    @page{margin:0.5in;}
  }

  .print-sheet{
    background:#fff;color:#111;padding:0;
    font-family:'Segoe UI',Arial,sans-serif;
  }
  .print-header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid #111;padding-bottom:10px;margin-bottom:16px;
  }
  .print-header h1{margin:0;font-size:24px;color:#111;}
  .print-header .ph-meta{font-size:12px;color:#333;text-align:right;line-height:1.5;}
  .print-page{page-break-after:always;}
  .print-page:last-child{page-break-after:auto;}
  .print-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    align-content:start;
  }
  .print-drill{
    border:1px solid #ccc;border-radius:8px;padding:12px 14px 14px;
    break-inside:avoid;page-break-inside:avoid;
    display:flex;flex-direction:column;gap:9px;
  }
  .print-drill .pd-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;}
  .print-drill .pd-num{
    display:inline-block;width:23px;height:23px;border-radius:50%;background:#111;color:#fff;
    text-align:center;line-height:23px;font-size:12.5px;font-weight:700;margin-right:8px;flex:none;
  }
  .print-drill h3{margin:0;font-size:16.5px;color:#111;flex:1;min-width:0;}
  .print-drill .pd-cat{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#555;
    border:1px solid #999;border-radius:20px;padding:1px 8px;margin-left:8px;white-space:nowrap;
  }
  .print-drill .pd-mins{font-size:11.5px;color:#555;font-weight:700;white-space:nowrap;margin-left:8px;}
  .print-drill p{font-size:14px;color:#222;line-height:1.55;margin:0;}
  .print-drill img{
    width:100%;border:1px solid #ccc;border-radius:6px;background:#fff;
    aspect-ratio:16/10;object-fit:contain;
  }
  .print-footer{margin-top:20px;font-size:10px;color:#888;text-align:center;border-top:1px solid #ccc;padding-top:8px;}
  @media print{
    .print-grid{grid-template-columns:1fr 1fr;gap:14px;}
    .print-drill img{aspect-ratio:16/10;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="crest">N</div>
    <div>
      <h1>Nashua South Panthers</h1>
      <p>Practice Planner</p>
    </div>
  </div>
  <div class="topnav">
    <button id="nav-build" class="active" onclick="setView('build')">Build Practice</button>
    <button id="nav-saved" onclick="setView('saved')">Saved Practices</button>
  </div>
</div>

<div class="app">

  <!-- ===================== BUILD VIEW ===================== -->
  <div id="view-build" class="view active">
    <div class="builder-grid">

      <!-- Filters -->
      <div class="panel">
        <h2><span class="dot"></span>Filter Drills</h2>
        <input type="text" class="search-box" id="searchBox" placeholder="Search drills..." oninput="renderLibrary()">
        <div class="filter-group">
          <div class="fg-title">Category</div>
          <div id="categoryFilters"></div>
        </div>
        <div class="filter-actions">
          <button class="btn-mini" onclick="selectAllCats(true)">Select all</button>
          <button class="btn-mini" onclick="selectAllCats(false)">Clear all</button>
        </div>
      </div>

      <!-- Library -->
      <div class="panel">
        <div class="library-header">
          <h2>Drill Library</h2>
          <span class="result-count" id="resultCount"></span>
        </div>
        <div class="drill-grid" id="drillGrid"></div>
      </div>

      <!-- Tray -->
      <div class="panel">
        <h2><span class="dot"></span>Today's Practice</h2>
        <div class="tray-head">
          <input type="text" id="practiceName" placeholder="Practice name (e.g. Session 3 – Attack)">
        </div>
        <div class="tray-meta">
          <input type="date" id="practiceDate">
          <input type="text" id="practiceNotes" placeholder="Focus / notes">
        </div>
        <div class="tray-list" id="trayList"></div>
        <div class="tray-summary">
          <span><strong id="trayCount">0</strong> drills</span>
          <span><strong id="trayMins">0</strong> min total</span>
        </div>
        <button class="btn-primary" onclick="savePractice()">Save Practice</button>
        <button class="btn-secondary" onclick="printCurrentTray()">Print Preview</button>
      </div>

    </div>
  </div>

  <!-- ===================== SAVED VIEW ===================== -->
  <div id="view-saved" class="view">
    <div class="library-header">
      <h2 style="color:var(--purple-900);">Saved Practices</h2>
      <span class="result-count" id="savedCount"></span>
    </div>
    <div id="savedGrid" class="saved-grid"></div>
  </div>

</div>

<!-- Print sheet (populated dynamically, only visible when printing) -->
<div class="print-sheet" id="printSheet"></div>

<!-- image zoom modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <img id="modalImg" src="" alt="Drill diagram">
    <h3 id="modalTitle" style="margin:12px 0 4px;color:var(--purple-900);"></h3>
    <p id="modalDesc" style="margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.55;"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

const CATEGORY_ORDER = ["Low Block","Attack","Transition","Skills","Warm-Up"];
const CATEGORY_TAG_CLASS = {
  "Low Block":"tag-lowblock",
  "Attack":"tag-attack",
  "Transition":"tag-transition",
  "Skills":"tag-skills",
  "Warm-Up":"tag-warmup"
};
const CATEGORY_SWATCH = {
  "Low Block":"#3d2264",
  "Attack":"#b3391f",
  "Transition":"#1f7a5c",
  "Skills":"#c07d1a",
  "Warm-Up":"#5a5069"
};

let activeCategories = new Set(CATEGORY_ORDER);
let tray = []; // {drillId, mins}
let currentPracticeId = null; // when editing/loading a saved practice

function drillById(id){ return DRILLS.find(d => d.id === id); }

// ---------- Category filter UI ----------
function buildCategoryFilters(){
  const wrap = document.getElementById('categoryFilters');
  wrap.innerHTML = '';
  CATEGORY_ORDER.forEach(cat => {
    const count = DRILLS.filter(d => d.category === cat).length;
    const label = document.createElement('label');
    label.className = 'cat-chip';
    label.innerHTML = `
      <input type="checkbox" checked data-cat="${cat}">
      <span class="swatch" style="background:${CATEGORY_SWATCH[cat]}"></span>
      <span>${cat}</span>
      <span class="cat-count">${count}</span>
    `;
    label.querySelector('input').addEventListener('change', (e) => {
      if(e.target.checked) activeCategories.add(cat);
      else activeCategories.delete(cat);
      renderLibrary();
    });
    wrap.appendChild(label);
  });
}
function selectAllCats(state){
  activeCategories = state ? new Set(CATEGORY_ORDER) : new Set();
  document.querySelectorAll('#categoryFilters input').forEach(cb => cb.checked = state);
  renderLibrary();
}

// ---------- Library rendering ----------
function renderLibrary(){
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const grid = document.getElementById('drillGrid');
  grid.innerHTML = '';
  const filtered = DRILLS.filter(d => {
    if(!activeCategories.has(d.category)) return false;
    if(search && !(d.name.toLowerCase().includes(search) || d.desc.toLowerCase().includes(search))) return false;
    return true;
  });
  document.getElementById('resultCount').textContent = `${filtered.length} drill${filtered.length!==1?'s':''}`;

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="es-icon">🔍</div>No drills match your filters.</div>`;
    return;
  }

  filtered.forEach(d => {
    const inTray = tray.some(t => t.drillId === d.id);
    const card = document.createElement('div');
    card.className = 'drill-card';
    card.innerHTML = `
      <div class="thumb ${d.imgData ? '' : 'noimg'}" data-drill="${d.id}">
        ${d.imgData ? `<img src="${d.imgData}" alt="${d.name}">` : 'No diagram'}
      </div>
      <div class="body">
        <span class="cat-tag ${CATEGORY_TAG_CLASS[d.category]}">${d.category}</span>
        <h3>${d.name}</h3>
        <p>${d.desc}</p>
        <button class="add-btn ${inTray ? 'added' : ''}" data-drill="${d.id}">${inTray ? '✓ Added' : '+ Add to Practice'}</button>
      </div>
    `;
    card.querySelector('.thumb').addEventListener('click', () => openModal(d));
    card.querySelector('.add-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleTray(d.id);
    });
    grid.appendChild(card);
  });
}

function openModal(d){
  if(!d.imgData) return;
  document.getElementById('modalImg').src = d.imgData;
  document.getElementById('modalTitle').textContent = d.name;
  document.getElementById('modalDesc').textContent = d.desc;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(e){
  if(e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('show');
}

// ---------- Tray ----------
function toggleTray(id){
  const idx = tray.findIndex(t => t.drillId === id);
  if(idx >= 0){
    tray.splice(idx,1);
  } else {
    tray.push({drillId:id, mins:15});
  }
  renderLibrary();
  renderTray();
}

function renderTray(){
  const list = document.getElementById('trayList');
  list.innerHTML = '';
  if(tray.length === 0){
    list.innerHTML = `<div class="tray-empty">No drills added yet.<br>Browse the library and hit "Add to Practice".</div>`;
  } else {
    tray.forEach((item, i) => {
      const d = drillById(item.drillId);
      if(!d) return;
      const row = document.createElement('div');
      row.className = 'tray-item';
      row.innerHTML = `
        <div class="ti-order">
          <button title="Move up" ${i===0?'disabled':''} data-act="up" data-i="${i}">▲</button>
          <button title="Move down" ${i===tray.length-1?'disabled':''} data-act="down" data-i="${i}">▼</button>
        </div>
        <div class="ti-thumb">${d.imgData ? `<img src="${d.imgData}">` : ''}</div>
        <div class="ti-info">
          <div class="ti-name">${d.name}</div>
          <div class="ti-cat">${d.category}</div>
        </div>
        <input type="number" class="ti-mins" min="1" max="90" value="${item.mins}" data-i="${i}">
        <button class="ti-remove" data-i="${i}" title="Remove">&times;</button>
      `;
      list.appendChild(row);
    });
  }
  list.querySelectorAll('[data-act="up"]').forEach(b => b.addEventListener('click', () => moveTrayItem(+b.dataset.i, -1)));
  list.querySelectorAll('[data-act="down"]').forEach(b => b.addEventListener('click', () => moveTrayItem(+b.dataset.i, 1)));
  list.querySelectorAll('.ti-remove').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    tray.splice(i,1);
    renderLibrary(); renderTray();
  }));
  list.querySelectorAll('.ti-mins').forEach(inp => inp.addEventListener('change', () => {
    const i = +inp.dataset.i;
    tray[i].mins = Math.max(1, parseInt(inp.value)||15);
    renderTraySummary();
  }));
  renderTraySummary();
}

function moveTrayItem(i, dir){
  const j = i + dir;
  if(j < 0 || j >= tray.length) return;
  [tray[i], tray[j]] = [tray[j], tray[i]];
  renderTray();
}

function renderTraySummary(){
  document.getElementById('trayCount').textContent = tray.length;
  const total = tray.reduce((s,t) => s + (t.mins||0), 0);
  document.getElementById('trayMins').textContent = total;
}

// ---------- Save / Storage ----------
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- Storage (browser localStorage — persists on this device/browser) ----------
const STORE_PREFIX = 'panthersPractice:';
const storageAvailable = (() => {
  try{
    const t = '__test__';
    localStorage.setItem(t,'1');
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
})();

function storeGet(key){
  if(!storageAvailable) return null;
  const raw = localStorage.getItem(STORE_PREFIX + key);
  return raw === null ? null : { value: raw };
}
function storeSet(key, value){
  if(!storageAvailable) throw new Error('localStorage unavailable');
  localStorage.setItem(STORE_PREFIX + key, value);
}
function storeDelete(key){
  if(!storageAvailable) return;
  localStorage.removeItem(STORE_PREFIX + key);
}

async function savePractice(){
  if(tray.length === 0){
    showToast('Add at least one drill before saving.');
    return;
  }
  if(!storageAvailable){
    showToast('Your browser is blocking local storage (private/incognito mode?) — saving is unavailable.');
    return;
  }
  const name = document.getElementById('practiceName').value.trim() || 'Untitled Practice';
  const date = document.getElementById('practiceDate').value || '';
  const notes = document.getElementById('practiceNotes').value.trim() || '';
  const id = currentPracticeId || ('practice_' + Date.now());
  const practice = {
    id, name, date, notes,
    drills: tray.map(t => ({drillId:t.drillId, mins:t.mins})),
    savedAt: new Date().toISOString()
  };
  try{
    storeSet('practice:' + id, JSON.stringify(practice));
    const indexResult = storeGet('practice_index');
    let idIndex = [];
    if(indexResult && indexResult.value){
      try{ idIndex = JSON.parse(indexResult.value); }catch(e){ idIndex = []; }
    }
    if(!idIndex.includes(id)) idIndex.push(id);
    storeSet('practice_index', JSON.stringify(idIndex));
    currentPracticeId = id;
    showToast('Practice saved: "' + name + '"');
    await loadSavedList();
  }catch(err){
    console.error('Save failed', err);
    showToast('Save failed — please try again.');
  }
}

async function loadSavedList(){
  const grid = document.getElementById('savedGrid');
  grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Loading saved practices…</div>`;
  let idIndex = [];
  try{
    const res = storeGet('practice_index');
    if(res && res.value) idIndex = JSON.parse(res.value);
  }catch(e){ idIndex = []; }

  if(idIndex.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="es-icon">📋</div>No saved practices yet.<br>Build a practice and click "Save Practice".</div>`;
    document.getElementById('savedCount').textContent = '';
    return;
  }

  const practices = [];
  for(const id of idIndex){
    try{
      const res = storeGet('practice:' + id);
      if(res && res.value) practices.push(JSON.parse(res.value));
    }catch(e){ /* skip missing */ }
  }
  practices.sort((a,b) => new Date(b.savedAt) - new Date(a.savedAt));
  document.getElementById('savedCount').textContent = `${practices.length} practice${practices.length!==1?'s':''}`;

  grid.innerHTML = '';
  practices.forEach(p => {
    const card = document.createElement('div');
    card.className = 'saved-card';
    const drillNames = p.drills.map(t => {
      const d = drillById(t.drillId);
      return d ? d.name : '(removed drill)';
    });
    const totalMins = p.drills.reduce((s,t)=>s+(t.mins||0),0);
    card.innerHTML = `
      <h3>${p.name}</h3>
      <div class="sc-meta">${p.date ? formatDate(p.date) + ' · ' : ''}${p.drills.length} drills · ${totalMins} min${p.notes ? ' · ' + escapeHtml(p.notes) : ''}</div>
      <div class="sc-drills">${drillNames.map(n=>'• '+n).join('<br>')}</div>
      <div class="sc-actions">
        <button class="sc-load">Load</button>
        <button class="sc-print">Print</button>
        <button class="sc-del">Delete</button>
      </div>
    `;
    card.querySelector('.sc-load').addEventListener('click', () => loadPracticeIntoBuilder(p));
    card.querySelector('.sc-print').addEventListener('click', () => printPractice(p));
    card.querySelector('.sc-del').addEventListener('click', () => deletePractice(p.id));
    grid.appendChild(card);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso){
  try{
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
  }catch(e){ return iso; }
}

function loadPracticeIntoBuilder(p){
  currentPracticeId = p.id;
  document.getElementById('practiceName').value = p.name;
  document.getElementById('practiceDate').value = p.date || '';
  document.getElementById('practiceNotes').value = p.notes || '';
  tray = p.drills.map(t => ({drillId:t.drillId, mins:t.mins}));
  setView('build');
  renderLibrary();
  renderTray();
  showToast('Loaded "' + p.name + '" into builder');
}

async function deletePractice(id){
  if(!confirm('Delete this saved practice? This cannot be undone.')) return;
  try{
    storeDelete('practice:' + id);
    const res = storeGet('practice_index');
    let idIndex = res && res.value ? JSON.parse(res.value) : [];
    idIndex = idIndex.filter(x => x !== id);
    storeSet('practice_index', JSON.stringify(idIndex));
    if(currentPracticeId === id) currentPracticeId = null;
    showToast('Practice deleted');
    await loadSavedList();
  }catch(e){
    console.error(e);
    showToast('Delete failed');
  }
}

// ---------- Print ----------
function buildPrintSheet(practiceLike){
  const sheet = document.getElementById('printSheet');
  const name = practiceLike.name || 'Untitled Practice';
  const date = practiceLike.date ? formatDate(practiceLike.date) : '';
  const notes = practiceLike.notes || '';
  const items = practiceLike.drills;
  const totalMins = items.reduce((s,t)=>s+(t.mins||0),0);
  const PER_PAGE = 4;

  let html = `
    <div class="print-header">
      <h1>${escapeHtml(name)}</h1>
      <div class="ph-meta">
        Nashua South Panthers — Girls Varsity Soccer<br>
        ${date ? date + ' · ' : ''}${items.length} drills · ${totalMins} min total
        ${notes ? '<br>Focus: ' + escapeHtml(notes) : ''}
      </div>
    </div>
  `;

  for(let pageStart = 0; pageStart < items.length; pageStart += PER_PAGE){
    const pageItems = items.slice(pageStart, pageStart + PER_PAGE);
    html += `<div class="print-page"><div class="print-grid">`;
    pageItems.forEach((t, j) => {
      const i = pageStart + j;
      const d = drillById(t.drillId);
      if(!d) return;
      html += `
        <div class="print-drill">
          ${d.imgData ? `<img src="${d.imgData}" alt="${escapeHtml(d.name)}">` : ''}
          <div class="pd-head">
            <span class="pd-num">${i+1}</span>
            <h3>${escapeHtml(d.name)}</h3>
            <span class="pd-mins">${t.mins} min</span>
          </div>
          <span class="pd-cat">${d.category}</span>
          <p>${escapeHtml(d.desc)}</p>
        </div>
      `;
    });
    html += `</div></div>`;
  }

  html += `<div class="print-footer">Panther Practice Framework · 4-3-3 · Generated by Panthers Practice Planner</div>`;
  sheet.innerHTML = html;
}


function printCurrentTray(){
  if(tray.length === 0){
    showToast('Add drills to the practice before printing.');
    return;
  }
  const p = {
    name: document.getElementById('practiceName').value.trim() || 'Untitled Practice',
    date: document.getElementById('practiceDate').value || '',
    notes: document.getElementById('practiceNotes').value.trim() || '',
    drills: tray
  };
  buildPrintSheet(p);
  setTimeout(() => window.print(), 80);
}

function printPractice(p){
  buildPrintSheet(p);
  setTimeout(() => window.print(), 80);
}

// ---------- View switching ----------
function setView(view){
  document.getElementById('view-build').classList.toggle('active', view==='build');
  document.getElementById('view-saved').classList.toggle('active', view==='saved');
  document.getElementById('nav-build').classList.toggle('active', view==='build');
  document.getElementById('nav-saved').classList.toggle('active', view==='saved');
  if(view === 'saved') loadSavedList();
}

// ---------- Init ----------
function init(){
  buildCategoryFilters();
  renderLibrary();
  renderTray();
  const dateInput = document.getElementById('practiceDate');
  const today = new Date();
  dateInput.value = today.toISOString().slice(0,10);
}
init();
</script>
